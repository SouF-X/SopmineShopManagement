<template id="delete-dialog-template">
  <dialog class="delete-dialog" data-delete-dialog aria-labelledby="delete-dialog-title">
    <section class="delete-dialog-panel">
      <header class="delete-dialog-head">
        <span class="delete-dialog-icon"><span class="material-symbols-rounded">delete</span></span>
        <div>
          <span class="delete-dialog-eyebrow">Confirmation requise</span>
          <h2 id="delete-dialog-title" data-delete-title></h2>
        </div>
      </header>
      <p class="delete-dialog-message" data-delete-message></p>
      <strong class="delete-dialog-target" data-delete-target></strong>
      <div class="delete-dialog-note">
        <span class="material-symbols-rounded">info</span>
        <span>Cette action est définitive et ne peut pas être annulée.</span>
      </div>
      <footer class="delete-dialog-actions">
        <button class="btn btn-secondary" type="button" data-delete-cancel>Annuler</button>
        <button class="btn delete-dialog-confirm" type="button" data-delete-confirm>
          <span class="material-symbols-rounded">delete</span>
          Supprimer
        </button>
      </footer>
    </section>
  </dialog>
</template>

<template id="contact-entry-template">
  <div class="contact-entry-form" data-contact-entry>
    <input name="contactName" data-contact-name aria-label="Nom du contact" autocomplete="name" placeholder="Nom complet" />
    <select name="contactRole" data-contact-role aria-label="Rôle"><option>Commercial</option><option>SAV</option></select>
    <input name="contactPhone" data-contact-phone type="tel" inputmode="tel" aria-label="Téléphone du contact" autocomplete="tel" placeholder="Téléphone" />
    <button class="table-icon-btn" type="button" data-remove-contact aria-label="Supprimer le contact"><span class="material-symbols-rounded">delete</span></button>
  </div>
</template>

<div id="references-page-view" data-static-view hidden class="view-enter"><header class="page-head" data-page-header><div class="page-head-copy"><span class="eyebrow"><span data-page-icon></span><span data-page-eyebrow></span></span><h1><span data-page-title></span><span class="count-inline" data-page-count aria-hidden="true"></span></h1><p data-page-description></p></div><div class="page-head-actions"><button class="btn btn-secondary" type="button" data-page-secondary><span data-action-icon></span><span class="btn-label" data-action-label></span></button><button class="btn btn-primary" type="button" data-page-primary><span class="material-symbols-rounded">add</span><span data-action-label></span></button></div></header><div class="reference-grid"><div data-family-panel></div><div data-unit-panel></div></div></div>

</template>

<template id="reference-row-template">
  <article class="reference-row"><span class="reference-icon" data-reference-code></span><span class="reference-copy"><strong data-reference-name></strong><small><span class="mono" data-reference-code></span> · <span data-reference-count></span></small></span><span class="inline-actions"><button class="table-icon-btn" type="button" data-edit aria-label="Modifier le référentiel"><span class="material-symbols-rounded">edit</span></button><button class="table-icon-btn" type="button" data-delete aria-label="Supprimer le référentiel"><span class="material-symbols-rounded">delete</span></button></span></article>
</template>

<template id="reference-form-dialog-template">

    </form>
  </dialog>
</template>
